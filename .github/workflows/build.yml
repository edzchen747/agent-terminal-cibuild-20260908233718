name: Build Agent Terminal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build shared protocol
        run: npm run build -w @agentterminal/protocol

      - name: Build and sync Capacitor Android project
        run: npm run android:sync

      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: bash ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: agent-terminal-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    name: Windows installer and verification
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build shared protocol
        run: npm run build -w @agentterminal/protocol

      - name: Typecheck
        run: npm run typecheck

      - name: Run protocol tests
        run: npm run test

      - name: Build Windows installer
        run: npm run package:win -w @agentterminal/desktop

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: agent-terminal-windows-installer
          path: apps/desktop/release/Agent Terminal Setup 0.1.2.exe
          if-no-files-found: error
