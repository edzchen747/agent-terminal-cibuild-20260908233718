name: Build Agent Terminal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build shared protocol
        run: npm run build -w @agentterminal/protocol

      - name: Prepare embedded node dependencies
        working-directory: apps/embedded-node
        run: go mod tidy

      - name: Build Android embedded node
        shell: pwsh
        run: ./scripts/build-embedded-node-android.ps1

      - name: Build and sync Capacitor Android project
        run: npm run android:sync

      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: bash ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: agent-terminal-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    name: Windows portable executable and verification
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build shared protocol
        run: npm run build -w @agentterminal/protocol

      - name: Typecheck
        run: npm run typecheck

      - name: Run protocol tests
        run: npm run test

      - name: Build portable Windows executable
        run: npm run package:win -w @agentterminal/desktop

      - name: Upload portable Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: agent-terminal-windows-portable
          path: apps/desktop/src-tauri/target/release/agent-terminal.exe
          if-no-files-found: error
