name: Build embedded node

on:
  push:
    branches: [main]
    paths:
      - 'apps/embedded-node/**'
      - 'scripts/build-embedded-node.ps1'
      - '.github/workflows/embedded-node.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/embedded-node/**'
      - 'scripts/build-embedded-node.ps1'
      - '.github/workflows/embedded-node.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: embedded-node-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows embedded-node.exe
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/embedded-node/go.mod
          cache: true
          cache-dependency-path: apps/embedded-node/go.mod

      - name: Resolve Go dependencies
        working-directory: apps/embedded-node
        run: go mod tidy

      - name: Build embedded-node.exe
        shell: pwsh
        run: ./scripts/build-embedded-node.ps1

      - name: Upload embedded-node.exe
        uses: actions/upload-artifact@v4
        with:
          name: embedded-node-windows-${{ github.sha }}
          path: apps/desktop/src-tauri/resources/embedded-node/embedded-node.exe
          if-no-files-found: error
