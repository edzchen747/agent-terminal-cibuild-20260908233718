name: Build Agent Terminal Android

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'apps/embedded-node/**'
      - 'packages/protocol/**'
      - 'scripts/build-embedded-node-android.ps1'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'apps/embedded-node/**'
      - 'packages/protocol/**'
      - 'scripts/build-embedded-node-android.ps1'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      build_variant:
        description: APK variant to build
        type: choice
        default: debug
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/apps/mobile/android/keystore/agent-terminal-release.jks
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build shared protocol
        run: npm run build -w @agentterminal/protocol

      - name: Prepare embedded node dependencies
        working-directory: apps/embedded-node
        run: go mod tidy

      - name: Build Android embedded node
        shell: pwsh
        run: ./scripts/build-embedded-node-android.ps1

      # Also published on its own, so a run that was really about the APK
      # still yields the library to drop into jniLibs. The embedded-node
      # workflow builds the same file without the Android toolchain when the
      # APK is not what is wanted.
      - name: Upload Android embedded node library
        uses: actions/upload-artifact@v4
        with:
          name: libembedded-node-android-arm64-${{ github.sha }}
          path: apps/mobile/android/app/src/main/jniLibs/arm64-v8a/libembedded-node.so
          if-no-files-found: error

      - name: Build and sync Capacitor Android project
        run: npm run android:sync

      - name: Determine build variant
        id: variant
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            pull_request)
              variant=debug
              ;;
            workflow_dispatch)
              variant="${{ inputs.build_variant }}"
              ;;
            *)
              variant=release
              ;;
          esac
          echo "variant=${variant}" >> "$GITHUB_OUTPUT"

      - name: Verify Android release signing secrets
        if: ${{ steps.variant.outputs.variant == 'release' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required Android signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Restore Android release keystore
        if: ${{ steps.variant.outputs.variant == 'release' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$ANDROID_KEYSTORE_PATH")"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

      - name: Assemble signed release APK
        if: ${{ steps.variant.outputs.variant == 'release' }}
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew assembleRelease --no-daemon -PrequireReleaseSigning=true

      - name: Assemble debug APK
        if: ${{ steps.variant.outputs.variant == 'debug' }}
        working-directory: apps/mobile/android
        run: bash ./gradlew assembleDebug --no-daemon

      - name: Upload signed Android release APK
        if: ${{ steps.variant.outputs.variant == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent-terminal-android-release
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Android debug APK
        if: ${{ steps.variant.outputs.variant == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent-terminal-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
